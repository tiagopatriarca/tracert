services:
  tracert:
    build: .
    container_name: tracert-plus
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracert.rule=Host(`tracert.tiplus.inf.br`)"
      - "traefik.http.routers.tracert.entrypoints=websecure"
      - "traefik.http.routers.tracert.tls.certresolver=letsencrypt"
      - "traefik.http.services.tracert.loadbalancer.server.port=3000"

networks:
  traefik-public:
    external: true

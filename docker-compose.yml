services:
  tracert:
    build: .
    image: tracert-plus:latest
    container_name: tracert-plus
    restart: unless-stopped
    ports:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracert.rule=Host(`tracert.tiplus.inf.br`)"
      - "traefik.http.routers.tracert.entrypoints=websecure"
      - "traefik.http.routers.tracert.tls.certresolver=letsencrypt"
      - "traefik.http.services.tracert.loadbalancer.server.port=3000"
    environment:
      - TZ=America/Sao_Paulo
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - JWT_SECRET=TRACERT_PROD_JWT_SEC_78b2f91a0c4e85d1e63ab94f27103ca7
    volumes:
      - ./data:/app/data
